name: LinkedIn Scraper

on:
  workflow_dispatch: # Manual trigger (no random delay)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Random delay (skip on manual trigger)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 7200))
          echo "Waiting ${DELAY}s ($(($DELAY / 60))m) before starting..."
          sleep $DELAY

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          HEADLESS: 'true'
          MAX_MINUTES: '55'
          CI: 'true'
        run: python linkedin_scraper.py

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/stats/stats.json data/stats/list_health.json config/lists.json data/linkedin/scraped_history.txt data/linkedin/name_history.txt data/linkedin/scraper_state.json data/linkedin/healer_state.json || true
          git diff --cached --quiet || git commit -m "stats: automated run $(date -u +%Y%m%d_%H%M%S)"
          git push

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-scraper-results
          path: |
            data/stats/
            output/linkedin/
